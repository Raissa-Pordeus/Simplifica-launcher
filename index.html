<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simplifica</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            overflow: hidden;
            padding: 15px;
        }
        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 22%;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            border: 3px solid #ffffff;
            cursor: pointer;
        }
        .btn-wpp { background-color: #222222; }
        .btn-tel { background-color: #333333; }
        .btn-cam { background-color: #444444; }
        .btn-sos { background-color: #cc0000; border-color: #ff9999; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <a href="https://wa.me/5583999999999" class="btn btn-wpp">Zap Ana Larissa</a>
    <a href="tel:+5583988888888" class="btn btn-tel">Ligar Teones</a>
    <label class="btn btn-cam">
        📷 Câmera
        <input type="file" accept="image/*" capture="camera">
    </label>
    <a href="https://wa.me/5583999999999?text=SOCORRO!%20Preciso%20de%20ajuda%20urgente!" class="btn btn-sos">SOS EMERGÊNCIA</a>
</body>
</html>
