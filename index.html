<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
        background-color: #121212; 
        color: #ffffff; 
        font-family: system-ui, -apple-system, sans-serif; 
        height: 100vh; 
        overflow-y: auto; 
        padding: 30px 20px; 
        display: flex; 
        flex-direction: column; 
        gap: 25px; 
    }
    
    .btn { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        width: 100%; 
        min-height: 16vh; 
        border-radius: 30px; 
        text-decoration: none; 
        color: #ffffff; 
        font-size: 2.4rem; 
        font-weight: 900; 
        text-align: center; 
        border: 4px solid; 
        /* Efeito 3D de botão físico */
        box-shadow: 0 12px 0 #000000, 0 16px 20px rgba(0,0,0,0.6); 
        cursor: pointer; 
        flex: 1; 
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        transition: transform 0.1s, box-shadow 0.1s; 
    }

    /* Animação que simula o botão sendo pressionado ao tocar */
    .btn:active {
        transform: translateY(8px);
        box-shadow: 0 4px 0 #000000, 0 8px 10px rgba(0,0,0,0.6);
    }
    
    /* Fundos em gradiente premium com bordas coloridas para identificação rápida */
    .btn-wpp { background: linear-gradient(145deg, #103020, #0a1c12); border-color: #25D366; }
    .btn-tel { background: linear-gradient(145deg, #102030, #0a121c); border-color: #34B7F1; }
    .btn-cam { background: linear-gradient(145deg, #333333, #151515); border-color: #aaaaaa; }
    .btn-sos { background: linear-gradient(145deg, #660000, #220000); border-color: #ff4444; }
    
    input[type="file"] { display: none; }
    
    .settings-icon { 
        position: fixed; 
        top: 25px; 
        right: 20px; 
        background: #222222; 
        border: 2px solid #555;
        border-radius: 50%; 
        width: 60px;
        height: 60px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.8rem; 
        color: #fff; 
        z-index: 10; 
        cursor: pointer; 
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
    }
    
    #settings { 
        display: none; 
        flex-direction: column; 
        gap: 20px; 
        background: #181818; 
        padding: 30px; 
        border-radius: 30px; 
        font-size: 1.2rem; 
        min-height: 100vh; 
    }
    
    input, select, button.action-btn { 
        font-size: 1.3rem; 
        padding: 16px; 
        width: 100%; 
        margin-top: 8px; 
        border-radius: 16px; 
        border: 2px solid #444; 
        background: #2a2a2a;
        color: #ffffff;
    }
    
    button.action-btn { 
        background: #ffffff; 
        color: #000000; 
        font-weight: bold; 
        cursor: pointer; 
        border: none;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4); 
    }
    
    .del-btn { 
        background: #cc0000; 
        color: white; 
        padding: 14px; 
        border-radius: 16px; 
        border: none; 
        margin-top: 16px; 
        width: 100%; 
        cursor: pointer; 
        font-weight: bold; 
    }
    
    .contact-item { 
        border: 2px solid #555; 
        background: #222; 
        padding: 20px; 
        border-radius: 20px; 
        margin-bottom: 16px; 
    }
</style>
</head>
<body>
    <button class="settings-icon" onclick="toggle()">⚙️</button>

    <div id="app" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
        <div id="dynamic-list" style="display: flex; flex-direction: column; gap: 12px; flex: 1;"></div>
        <label class="btn btn-cam">📷 Câmera <input type="file" accept="image/*" capture="camera"></label>
        <a id="btn-sos" href="#" class="btn btn-sos">SOS EMERGÊNCIA</a>
    </div>

    <div id="settings">
        <h2>Configurações</h2>
        
        <div style="background: #222; padding: 15px; border-radius: 8px;">
            <h3>Adicionar Botão</h3>
            <select id="type"><option value="wpp">WhatsApp</option><option value="tel">Ligação</option></select>
            <input id="name" placeholder="Nome do botão">
            <input id="num" placeholder="Número (ex: 5583999999999)">
            <button class="action-btn" onclick="add()">Adicionar</button>
        </div>

        <div style="background: #222; padding: 15px; border-radius: 8px;">
            <h3>Número SOS</h3>
            <input id="sosNum" placeholder="Número para socorro">
            <button class="action-btn" onclick="saveSOS()">Salvar SOS</button>
        </div>

        <div style="background: #222; padding: 15px; border-radius: 8px;">
            <h3>Excluir Botões</h3>
            <div id="edit-list"></div>
        </div>

        <button class="action-btn" onclick="toggle()">Voltar para o App</button>
    </div>

    <script>
        let contacts = JSON.parse(localStorage.getItem('simp_contacts')) || [
            { type: 'wpp', name: 'Zap Ana Larissa', num: '5583999999999' },
            { type: 'tel', name: 'Ligar Teones', num: '5583988888888' }
        ];
        let sos = localStorage.getItem('simp_sos') || '5583999999999';

        function render() {
            const list = document.getElementById('dynamic-list');
            const edit = document.getElementById('edit-list');
            list.innerHTML = ''; edit.innerHTML = '';
            
            contacts.forEach((c, i) => {
                const prefix = c.type === 'wpp' ? 'https://wa.me/' : 'tel:+';
                const cls = c.type === 'wpp' ? 'btn-wpp' : 'btn-tel';
                list.innerHTML += `<a href="${prefix}${c.num}" class="btn ${cls}">${c.name}</a>`;
                edit.innerHTML += `<div class="contact-item"><b>${c.name}</b><br>${c.num} <button class="del-btn" onclick="del(${i})">Excluir</button></div>`;
            });
            
            document.getElementById('btn-sos').href = `https://wa.me/${sos}?text=SOCORRO!%20Preciso%20de%20ajuda%20urgente!`;
            document.getElementById('sosNum').value = sos;
            
            localStorage.setItem('simp_contacts', JSON.stringify(contacts));
            localStorage.setItem('simp_sos', sos);
        }

        function add() {
            const type = document.getElementById('type').value;
            const name = document.getElementById('name').value;
            const num = document.getElementById('num').value.replace(/\D/g,'');
            if (name && num) { contacts.push({ type, name, num }); render(); document.getElementById('name').value = ''; document.getElementById('num').value = ''; }
        }

        function del(i) { contacts.splice(i, 1); render(); }
        function saveSOS() { sos = document.getElementById('sosNum').value.replace(/\D/g,''); render(); alert('SOS Atualizado!'); }
        function toggle() { 
            const s = document.getElementById('settings');
            const a = document.getElementById('app');
            const isSettings = s.style.display === 'flex';
            s.style.display = isSettings ? 'none' : 'flex';
            a.style.display = isSettings ? 'flex' : 'none';
        }

        render();
    </script>
</body>
</html>
